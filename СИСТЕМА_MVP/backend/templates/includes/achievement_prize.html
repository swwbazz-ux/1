<script>
(function () {
    if (window.bindAchievementPrizeUnlock) {
        return;
    }

    function csrfToken() {
        var input = document.querySelector("input[name='csrfmiddlewaretoken']");
        return input ? input.value : "";
    }

    function createAchievementModal() {
        var existing = document.querySelector("[data-achievement-prize-modal]");
        if (existing) {
            return existing;
        }
        var modal = document.createElement("div");
        modal.className = "achievement-prize-modal";
        modal.hidden = true;
        modal.setAttribute("data-achievement-prize-modal", "");
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.innerHTML = [
            '<section class="achievement-prize-stage" data-achievement-stage>',
                '<div class="achievement-prize-burst" aria-hidden="true"></div>',
                '<div class="achievement-prize-confetti" data-achievement-confetti aria-hidden="true"></div>',
                '<article class="achievement-prize-card">',
                    '<div class="achievement-prize-copy">',
                        '<span>Сменный план выполнен</span>',
                        '<strong data-achievement-title>План выполнен</strong>',
                        '<em data-achievement-percent>100%</em>',
                    '</div>',
                    '<div class="achievement-prize-image-wrap">',
                        '<img data-achievement-image alt="Приз за выполнение сменного плана">',
                    '</div>',
                    '<div class="achievement-prize-actions">',
                        '<button type="button" data-achievement-save>Сохранить</button>',
                        '<button type="button" data-achievement-close>Закрыть</button>',
                    '</div>',
                '</article>',
            '</section>'
        ].join("");
        document.body.appendChild(modal);
        return modal;
    }

    function fillConfetti(stage) {
        var holder = stage.querySelector("[data-achievement-confetti]");
        if (!holder || holder.dataset.ready === "true") {
            return;
        }
        holder.dataset.ready = "true";
        var colors = ["#7cff58", "#ffd335", "#5bd6ff", "#ffffff", "#98ff35"];
        var pieces = [];
        for (var index = 0; index < 44; index += 1) {
            var angle = (Math.PI * 2 * index) / 44;
            var distance = 130 + ((index % 9) * 22);
            var span = document.createElement("span");
            span.style.setProperty("--x", (34 + ((index * 17) % 34)) + "%");
            span.style.setProperty("--tx", Math.round(Math.cos(angle) * distance) + "px");
            span.style.setProperty("--ty", Math.round(Math.sin(angle) * distance - 80) + "px");
            span.style.setProperty("--r", ((index * 37) % 180) + "deg");
            span.style.setProperty("--s", (7 + (index % 5)) + "px");
            span.style.setProperty("--d", ((index % 8) * 45) + "ms");
            span.style.setProperty("--c", colors[index % colors.length]);
            pieces.push(span);
        }
        pieces.forEach(function (piece) {
            holder.appendChild(piece);
        });
    }

    function markAchievementShown(unlockId) {
        if (!unlockId || !window.fetch) {
            return Promise.resolve(null);
        }
        return fetch("/api/achievements/" + unlockId + "/shown/", {
            method: "POST",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
                "Accept": "application/json",
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": csrfToken()
            }
        }).catch(function () {
            return null;
        });
    }

    function showAchievementPrize(data) {
        if (!data || !data.unlocked || !data.unlock_id || data.shown) {
            return false;
        }
        var modal = createAchievementModal();
        if (!modal.hidden && modal.dataset.achievementUnlockId === String(data.unlock_id)) {
            return true;
        }
        modal.dataset.achievementUnlockId = String(data.unlock_id);
        var stage = modal.querySelector("[data-achievement-stage]");
        var title = modal.querySelector("[data-achievement-title]");
        var percent = modal.querySelector("[data-achievement-percent]");
        var image = modal.querySelector("[data-achievement-image]");
        var saveButton = modal.querySelector("[data-achievement-save]");
        var closeButton = modal.querySelector("[data-achievement-close]");
        fillConfetti(stage);
        if (title) title.textContent = data.title || "План выполнен";
        if (percent) percent.textContent = (data.percent || 100) + "% сменного плана";
        if (image) {
            image.removeAttribute("src");
            image.src = data.image_url;
        }
        modal.hidden = false;
        stage.classList.remove("is-prize");
        stage.classList.add("is-celebrating");
        window.setTimeout(function () {
            stage.classList.remove("is-celebrating");
            stage.classList.add("is-prize");
        }, 2400);

        if (saveButton) {
            saveButton.onclick = function () {
                var targetUrl = data.download_url || data.image_url;
                if (!targetUrl) return;
                markAchievementShown(data.unlock_id);
                var opened = window.open(targetUrl, "_blank", "noopener");
                if (!opened) {
                    window.location.href = targetUrl;
                }
            };
        }
        if (closeButton) {
            closeButton.onclick = function () {
                markAchievementShown(data.unlock_id);
                modal.hidden = true;
                stage.classList.remove("is-celebrating", "is-prize");
            };
        }
        return true;
    }

    function requestAchievementPrize() {
        if (!window.fetch) {
            return Promise.resolve({ok: false, data: null});
        }
        return fetch("/api/achievements/current/", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
                "Accept": "application/json",
                "X-Requested-With": "XMLHttpRequest"
            }
        }).then(function (response) {
            if (!response.ok) {
                return {ok: false, data: null};
            }
            return response.json().then(function (data) {
                showAchievementPrize(data);
                return {ok: true, data: data};
            });
        }).catch(function () {
            return {ok: false, data: null};
        });
    }

    var ACHIEVEMENT_DEBOUNCE_MS = 250;
    var ACHIEVEMENT_RETRY_DELAYS = [1000, 3000, 10000];
    var achievementCheckTimer = null;
    var achievementRequestInFlight = null;
    var achievementInFlightKey = "";
    var achievementCompletedKey = "";
    var failedAchievementCheck = null;
    var pendingAchievementCheck = null;
    var achievementInitialConsumed = false;
    var achievementConnectionState = null;

    function matchingAchievementEventKey(context) {
        if (!context) return "";
        var driverShell = document.querySelector("[data-driver-shell]");
        var excavatorShell = document.querySelector("[data-eo-shell]");
        var currentTruckId = driverShell
            ? String(driverShell.dataset.driverCurrentTruckId || "")
            : "";
        var activeExcavatorId = excavatorShell
            ? String(excavatorShell.dataset.eoCurrentExcavatorId || "")
            : "";
        var currentExcavatorId = activeExcavatorId;
        var events = Array.isArray(context.events) ? context.events : [];
        for (var index = 0; index < events.length; index += 1) {
            var event = events[index] || {};
            var payload = event.payload || {};
            if (event.type !== "trip_changed" || payload.status !== "completed") {
                continue;
            }
            var equipmentMatches = (
                currentTruckId
                && String(payload.truck_id || "") === currentTruckId
            ) || (
                currentExcavatorId
                && String(payload.excavator_id || "") === currentExcavatorId
            );
            if (!equipmentMatches) continue;
            return [
                String(context.version || event.version || ""),
                String(payload.trip_id || ""),
                currentTruckId ? "truck:" + currentTruckId : "excavator:" + currentExcavatorId
            ].join(":");
        }
        if (context.eventsTruncated) {
            var activeEquipmentKey = currentTruckId
                ? "truck:" + currentTruckId
                : (activeExcavatorId ? "excavator:" + activeExcavatorId : "");
            if (activeEquipmentKey) {
                return [
                    String(context.version || ""),
                    "truncated",
                    activeEquipmentKey
                ].join(":");
            }
        }
        return "";
    }

    function clearAchievementCheckTimer() {
        if (achievementCheckTimer !== null) {
            window.clearTimeout(achievementCheckTimer);
            achievementCheckTimer = null;
        }
    }

    function schedulePendingAchievementRun(delay, replaceTimer) {
        if (
            !pendingAchievementCheck
            || document.hidden
            || achievementRequestInFlight
        ) {
            return;
        }
        if (achievementCheckTimer !== null) {
            if (!replaceTimer) {
                return;
            }
            clearAchievementCheckTimer();
        }
        achievementCheckTimer = window.setTimeout(function () {
            achievementCheckTimer = null;
            runPendingAchievementCheck();
        }, delay);
    }

    function runPendingAchievementCheck() {
        if (!pendingAchievementCheck || document.hidden) {
            return;
        }
        if (achievementRequestInFlight) {
            return;
        }
        var check = pendingAchievementCheck;
        pendingAchievementCheck = null;
        achievementInFlightKey = check.key;
        achievementInitialConsumed = true;
        achievementRequestInFlight = requestAchievementPrize().then(function (result) {
            if (result && result.ok) {
                achievementCompletedKey = check.key;
                failedAchievementCheck = null;
            } else {
                if (
                    !pendingAchievementCheck
                    || pendingAchievementCheck.key === check.key
                ) {
                    var nextRetryAttempt = (check.retryAttempt || 0) + 1;
                    failedAchievementCheck = {
                        key: check.key,
                        retryAttempt: 0
                    };
                    if (nextRetryAttempt <= ACHIEVEMENT_RETRY_DELAYS.length) {
                        pendingAchievementCheck = {
                            key: check.key,
                            retryAttempt: nextRetryAttempt
                        };
                    }
                }
            }
            return result;
        }).finally(function () {
            achievementRequestInFlight = null;
            achievementInFlightKey = "";
            if (
                pendingAchievementCheck
                && pendingAchievementCheck.key !== achievementCompletedKey
                && !document.hidden
            ) {
                var retryAttempt = pendingAchievementCheck.retryAttempt || 0;
                var delay = retryAttempt
                    ? ACHIEVEMENT_RETRY_DELAYS[retryAttempt - 1]
                    : ACHIEVEMENT_DEBOUNCE_MS;
                schedulePendingAchievementRun(delay, false);
            }
        });
    }

    function scheduleAchievementCheck(context, initial) {
        var key = initial ? "initial" : matchingAchievementEventKey(context);
        if (!key || key === achievementCompletedKey) {
            return achievementRequestInFlight || Promise.resolve(null);
        }
        if (achievementRequestInFlight && key === achievementInFlightKey) {
            return achievementRequestInFlight;
        }
        if (pendingAchievementCheck && key === pendingAchievementCheck.key) {
            return achievementRequestInFlight || Promise.resolve(null);
        }
        if (
            failedAchievementCheck
            && key !== failedAchievementCheck.key
        ) {
            failedAchievementCheck = null;
        }
        if (
            failedAchievementCheck
            && key === failedAchievementCheck.key
            && !pendingAchievementCheck
        ) {
            return Promise.resolve(null);
        }
        if (pendingAchievementCheck && pendingAchievementCheck.key !== key) {
            clearAchievementCheckTimer();
        }
        pendingAchievementCheck = {key: key, retryAttempt: 0};
        if (document.hidden) {
            return achievementRequestInFlight || Promise.resolve(null);
        }
        if (achievementRequestInFlight) {
            return achievementRequestInFlight;
        }
        schedulePendingAchievementRun(ACHIEVEMENT_DEBOUNCE_MS, false);
        return Promise.resolve(null);
    }

    function recoverAchievementCheck() {
        if (document.hidden || achievementRequestInFlight) {
            return;
        }
        if (!pendingAchievementCheck && failedAchievementCheck) {
            pendingAchievementCheck = {
                key: failedAchievementCheck.key,
                retryAttempt: failedAchievementCheck.retryAttempt || 0
            };
            failedAchievementCheck = null;
        }
        if (pendingAchievementCheck) {
            schedulePendingAchievementRun(
                ACHIEVEMENT_DEBOUNCE_MS,
                true
            );
        }
    }

    window.bindAchievementPrizeUnlock = function () {
        if (window.__achievementPrizeBound) {
            return;
        }
        window.__achievementPrizeBound = true;
        window.checkAchievementPrize = function (context) {
            return scheduleAchievementCheck(context, false);
        };
        window.setTimeout(function () {
            if (
                !achievementInitialConsumed
                && !pendingAchievementCheck
                && !achievementRequestInFlight
            ) {
                scheduleAchievementCheck(null, true);
            }
        }, 1200);
        document.addEventListener("visibilitychange", function () {
            recoverAchievementCheck();
        });
        if (window.addEventListener) {
            window.addEventListener("online", recoverAchievementCheck);
            window.addEventListener(
                "operational-state-connection",
                function (event) {
                    var detail = event && event.detail ? event.detail : {};
                    if (detail.reconnected === true) {
                        achievementConnectionState = true;
                        recoverAchievementCheck();
                        return;
                    }
                    if (detail.connected === false) {
                        achievementConnectionState = false;
                        return;
                    }
                    if (detail.connected === true) {
                        var recovered = achievementConnectionState === false;
                        achievementConnectionState = true;
                        if (recovered) {
                            recoverAchievementCheck();
                        }
                    }
                }
            );
        }
        if (
            window.navigator
            && window.navigator.connection
            && window.navigator.connection.addEventListener
        ) {
            window.navigator.connection.addEventListener(
                "change",
                recoverAchievementCheck
            );
        }
    };
})();
</script>
