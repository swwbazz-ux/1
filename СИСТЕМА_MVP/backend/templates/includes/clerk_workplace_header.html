<header class="admin-console-header clerk-workplace-header" aria-label="Рабочая шапка делопроизводителя">
    <section class="admin-console-identity">
        <span class="admin-console-avatar" aria-hidden="true">{{ access.employee.full_name|default:"Д"|first }}</span>
        <span>
            <strong>{{ access.employee.full_name|default:"Делопроизводитель" }}</strong>
            <em>Делопроизводитель</em>
        </span>
    </section>

    <section class="admin-console-main">
        <div class="admin-console-title">
            <span>Рабочее место</span>
            <h1>Делопроизводитель</h1>
            <p>Работа с фактическим размещением сотрудников.</p>
        </div>
        <nav class="admin-console-nav" aria-label="Разделы делопроизводителя">
            <button type="button"
                    class="{% if clerk_active_section == "settlement" %}is-active{% endif %}"
                    data-clerk-section="settlement"
                    data-unsettled-panel-toggle
                    aria-controls="settlement-unsettled-panel"
                    aria-expanded="false">Расселение</button>
        </nav>
    </section>

    <section class="admin-console-actions clerk-console-actions" aria-label="Тема и выход">
        <button type="button"
                class="admin-theme-button"
                data-admin-theme-toggle
                data-theme-icon="sun"
                aria-label="Переключить дневной и ночной режим"
                title="Переключить дневной и ночной режим"></button>
        <a class="admin-utility-link" href="{% url 'logout' %}">Выйти</a>
    </section>
</header>
