<button class="credential-visibility-toggle{% if login_style %} login-pin-reveal{% endif %}" type="button"
        aria-controls="{{ field_id }}" aria-label="Показать {{ credential_label|default:'PIN' }}"
        aria-pressed="false" data-credential-label="{{ credential_label|default:'PIN' }}">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
        <path class="credential-visibility-slash" d="M3 3l18 18"/>

</button>
