<nav class="mobile-dial-actions" aria-label="Дополнительные действия">
    <svg class="mobile-dial-actions__defs" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
            <clipPath id="driver-dial-corner-clip" clipPathUnits="objectBoundingBox">
                <path transform="scale(.01 .008620689655172414)" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
            </clipPath>
            <linearGradient id="driver-dial-metal" x1="0" y1="0" x2=".25" y2="1">
                <stop offset="0" stop-color="#849597" />
                <stop offset=".08" stop-color="#34464e" />
                <stop offset=".5" stop-color="#14262e" />
                <stop offset="1" stop-color="#040b10" />
            </linearGradient>
            <linearGradient id="driver-dial-face" x1="0" y1="0" x2=".7" y2="1">
                <stop offset="0" stop-color="#304148" />
                <stop offset=".35" stop-color="#192a31" />
                <stop offset="1" stop-color="#0d1a21" />
            </linearGradient>
            <linearGradient id="driver-dial-metal-right" href="#driver-dial-metal" x1="1" y1="0" x2=".75" y2="1" />
            <linearGradient id="driver-dial-face-right" href="#driver-dial-face" x1="1" y1="0" x2=".3" y2="1" />
            <linearGradient id="driver-dial-metal-bottom" href="#driver-dial-metal" x1="1" y1="1" x2=".75" y2="0" />
            <linearGradient id="driver-dial-face-bottom" href="#driver-dial-face" x1="1" y1="1" x2=".3" y2="0" />
        </defs>
    </svg>

    <button class="mobile-dial-action mobile-dial-action--manual" type="button" data-mobile-dial-action="manual" disabled aria-disabled="true" aria-label="Ручной режим — пока недоступен" title="Ручной режим пока недоступен">
        <svg class="mobile-dial-action__shape" viewBox="0 0 100 116" aria-hidden="true" focusable="false">
            <path class="mobile-dial-action__rim" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
            <path class="mobile-dial-action__face" transform="translate(3 3) scale(.94)" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
        </svg>
        <svg class="mobile-dial-action__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="M17 27V13a3 3 0 0 1 6 0v11-3a3 3 0 0 1 6 0v4-2a3 3 0 0 1 6 0v4-1a3 3 0 0 1 6 0v9c0 7-5 11-12 11h-3c-5 0-8-3-10-7l-7-12a3 3 0 0 1 5-3l3 3Z" />
            <path class="mobile-dial-action__icon-line" d="M9 14a11 11 0 0 1 22 0M4 14a16 16 0 0 1 32 0" />
        </svg>
    </button>

    <button class="mobile-dial-action mobile-dial-action--dump-point" type="button" data-mobile-dial-action="dump-point"{% if mobile_dial_dump_point_enabled %} data-driver-point-open aria-label="Изменить точку разгрузки" title="Изменить точку разгрузки" aria-haspopup="dialog" aria-controls="driver-unload-dialog" aria-expanded="false"{% else %} disabled aria-disabled="true" aria-label="Изменить точку разгрузки — доступно только в активном рейсе" title="Точка разгрузки доступна только в активном рейсе"{% endif %}>
        <svg class="mobile-dial-action__shape" viewBox="0 0 100 116" aria-hidden="true" focusable="false">
            <path class="mobile-dial-action__rim" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
            <path class="mobile-dial-action__face" transform="translate(3 3) scale(.94)" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
        </svg>
        <svg class="mobile-dial-action__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" d="M23 3a11 11 0 0 0-11 11c0 8 11 20 11 20s11-12 11-20A11 11 0 0 0 23 3Zm0 15a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z" />
            <path class="mobile-dial-action__icon-line" d="M24 45v-8q0-4 4-4h14m-6-6 6 6-6 6" />
        </svg>
    </button>

    <button class="mobile-dial-action mobile-dial-action--free-bucket" type="button" data-mobile-dial-action="free-bucket"{% if mobile_dial_free_bucket_enabled %} aria-label="Свободный ковш" title="Выбрать свободный ковш" aria-haspopup="dialog" aria-controls="driver-free-bucket-dialog" aria-expanded="false"{% else %} disabled aria-disabled="true" aria-label="{% if mobile_dial_has_active_trip %}Свободный ковш недоступен во время активного рейса{% elif not mobile_dial_has_open_shift %}Откройте смену, чтобы выбрать свободный ковш{% elif not mobile_dial_has_current_truck %}Сначала выберите самосвал для текущей смены{% else %}Свободный ковш недоступен: нет рабочего контекста{% endif %}" title="{% if mobile_dial_has_active_trip %}Свободный ковш недоступен во время активного рейса{% elif not mobile_dial_has_open_shift %}Откройте смену, чтобы выбрать свободный ковш{% elif not mobile_dial_has_current_truck %}Сначала выберите самосвал для текущей смены{% else %}Свободный ковш недоступен: нет рабочего контекста{% endif %}"{% endif %}>
        <svg class="mobile-dial-action__shape" viewBox="0 0 100 116" aria-hidden="true" focusable="false">
            <path class="mobile-dial-action__rim" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
            <path class="mobile-dial-action__face" transform="translate(3 3) scale(.94)" d="M14 4H86Q96 4 96 13Q96 18 90 22A248 248 0 0 0 22 105Q17 116 10 111Q4 108 4 99V16Q4 4 14 4Z" />
        </svg>
        <svg class="mobile-dial-action__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="m21 4 6 2-6 15c-1 8 3 14 10 19l-7 1-2 4-4-1-1-4-3-1-2 4-4-2 1-4C0 32 3 23 10 20l5-2Z" />
            <circle cx="22" cy="9" r="1.5" fill="#14252b" />
            <path class="mobile-dial-action__icon-line" d="M38 17v14m-7-7h14" />
        </svg>
    </button>
</nav>
