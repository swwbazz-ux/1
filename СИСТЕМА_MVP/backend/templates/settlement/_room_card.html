{% if room %}
<article class="settlement-room settlement-room-{{ side }} status-{{ room.transfer_status }}"
         data-room-card
         data-room-id="{{ room.id }}"
         data-dormitory="{{ room.dormitory.number }}"
         data-floor="{{ room.floor }}"
         data-room-number="{{ room.number }}"
         data-transfer-status="{{ room.transfer_status }}"
         data-occupied-beds="{{ room.occupied_bed_count }}"
         data-free-beds="{{ room.free_bed_count }}"
         data-search="{{ room.search_text }}"
         aria-label="КИС-{{ room.dormitory.number }}, этаж {{ room.floor }}, комната {{ room.number }}, {{ room.get_transfer_status_display|lower }}">
    <button type="button"
            class="settlement-room-number"
            data-room-open
            aria-label="Открыть комнату {{ room.number }}">{{ room.number }}</button>
    <span class="settlement-room-content">
        {% for block in room.view_blocks %}
            <span class="settlement-bed-block">
                <b>{{ block.label }}</b>
                <span class="settlement-bed-row">
                    {% for bed in block.beds %}
                        <button type="button"
                                class="settlement-bed{% if bed.active_occupancy %} is-occupied{% else %} is-free{% endif %}"
                                data-bed
                                data-bed-id="{{ bed.stable_id }}"
                                data-occupied="{% if bed.active_occupancy %}true{% else %}false{% endif %}"
                                data-occupant-name="{{ bed.occupant_name }}"
                                data-shift-label="{{ bed.shift_label }}"
                                data-work-label="{{ bed.work_label }}"
                                data-assignment-type-label="{{ bed.assignment_type_label }}"
                                data-dormitory-label="КИС-{{ room.dormitory.number }}"
                                data-floor-label="{{ room.floor }} этаж"
                                data-room-label="комната {{ room.number }}"
                                data-block-label="{{ block.label }}"
                                data-position-label="место {{ bed.position }}"
                                aria-label="КИС-{{ room.dormitory.number }}, этаж {{ room.floor }}, комната {{ room.number }}, блок {{ block.label }}, место {{ bed.position }}{% if bed.active_occupancy %}, занято, {{ bed.occupant_name }}{% else %}, свободно{% endif %}{% if not room.is_transferred %}, комната не передана{% endif %}"
                                {% if not room.is_transferred %}disabled{% endif %}>
                            <span>{{ bed.position }}</span>
                        </button>
                    {% endfor %}
                </span>
            </span>
        {% endfor %}
    </span>
    <span class="settlement-room-state">
        {% if room.is_transferred %}Передана{% else %}Не передана{% endif %}
    </span>
</article>
{% else %}
<div class="settlement-room-placeholder" aria-hidden="true"></div>
{% endif %}
