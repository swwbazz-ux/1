<form class="settlement-checkin settlement-placement-panel" data-bed-checkin
      action="{% url 'settlement_bed_checkin' %}" data-search-url="{% url 'settlement_bed_checkin_people' %}"
      aria-labelledby="bed-checkin-title" hidden>
    {% csrf_token %}
    <h3 id="bed-checkin-title">Заселение на койку <span data-checkin-place></span></h3>
    <div class="settlement-checkin-modes" role="group" aria-label="Как выбрать жильца">
        <button type="button" data-checkin-find aria-pressed="true">Поиск жильца</button>
        <button type="button" data-checkin-new aria-pressed="false">Новый жилец</button>
    </div>
    <label class="settlement-employee-search">
        <span>ФИО жильца</span>
        <input name="full_name" type="search" required maxlength="255" placeholder="Фамилия или табельный номер" autocomplete="off">
    </label>
    <div class="settlement-employee-results" data-checkin-results aria-label="Найденные люди" hidden></div>
    <div class="settlement-person-identity" data-checkin-selected aria-live="polite" hidden></div>
    <fieldset class="settlement-checkin-card" aria-label="Данные нового жильца" data-checkin-card hidden disabled>
        <fieldset class="settlement-checkin-choice">
            <legend>Тип жильца</legend>
            <div class="settlement-checkin-options">
                <label><input type="radio" name="resident_type" value="BUSINESS_TRIP" required><span>Командировка</span></label>
                <label><input type="radio" name="resident_type" value="CONTRACTOR" required><span>Подрядчик</span></label>
                <label><input type="radio" name="resident_type" value="EXTERNAL_OTHER" required><span>Другой</span></label>
            </div>
        </fieldset>
        <fieldset class="settlement-checkin-choice">
            <legend>Пол</legend>
            <div class="settlement-checkin-options">
                <label><input type="radio" name="sex" value="male" required><span><b aria-hidden="true">♂</b> Мужской</span></label>
                <label><input type="radio" name="sex" value="female" required><span><b aria-hidden="true">♀</b> Женский</span></label>
            </div>
        </fieldset>
        <div class="settlement-checkin-fields">
            <label class="settlement-employee-search"><span>Организация</span><input name="organization" required maxlength="255"></label>
            <label class="settlement-employee-search"><span>Должность или профессия · необязательно</span><input name="position_title" maxlength="255"></label>
            <label class="settlement-employee-search"><span>Телефон · необязательно</span><input name="phone" type="tel" maxlength="32"></label>
        </div>
        <fieldset class="settlement-checkin-choice">
            <legend>Смена</legend>
            <div class="settlement-checkin-options">
                <label><input type="radio" name="work_shift" value="day"><span>День</span></label>
                <label><input type="radio" name="work_shift" value="night"><span>Ночь</span></label>
                <label><input type="radio" name="work_shift" value="" checked><span>Не указана</span></label>
            </div>
        </fieldset>
    </fieldset>
    <details class="settlement-checkin-dates" data-checkin-dates>
        <summary><span>Даты проживания</span><strong data-checkin-period></strong></summary>
        <div class="settlement-checkin-fields">
            <label class="settlement-employee-search"><span>Дата заселения · по умолчанию сегодня</span><input name="arrival" type="date"></label>
            <label class="settlement-employee-search"><span>Выезд в 07:00 · если известен</span><input name="departure" type="date"></label>
        </div>
    </details>
    <div class="settlement-checkin-room" data-checkin-room hidden>
        <p class="settlement-placement-hint" data-checkin-room-rule hidden></p>
        <label class="settlement-employee-search" data-checkin-basis hidden><span>Основание размещения</span><input name="basis" maxlength="512"></label>
        <label class="settlement-checkin-confirm" data-checkin-itr hidden><input type="checkbox" name="confirm_itr"> <span>Подтверждаю категорию ИТР</span></label>
    </div>
    <p data-checkin-message role="status" class="settlement-placement-feedback" hidden></p>
    {% include "settlement/_category_exception_confirmation.html" %}
    <button type="submit" class="settlement-place-button">Заселить</button>
</form>
