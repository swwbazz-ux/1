name: Production deploy through GitHub

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify checks the channel without changing production"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy
      expected_commit:
        description: "Full 40-character commit SHA selected for this run"
        required: true
        type: string
      confirmation:
        description: "Enter DEPLOY for deploy mode or VERIFY for verify mode"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: accounting-production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate manual confirmation and revision
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          if [[ "$MODE" == "deploy" ]]; then
            test "$CONFIRMATION" = "DEPLOY"
          else
            test "$CONFIRMATION" = "VERIFY"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: СИСТЕМА_MVP/backend/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r "СИСТЕМА_MVP/backend/requirements.txt"

      - name: Prepare runtime directories for checks
        working-directory: СИСТЕМА_MVP/backend
        run: mkdir -p media/employee_photos

      - name: Run Django release checks
        working-directory: СИСТЕМА_MVP/backend
        env:
          DJANGO_SECRET_KEY: github-production-release-check
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Build deterministic release package
        run: |
          python .github/deploy/build_release.py \
            --root . \
            --files .github/deploy/production-files.txt \
            --output "$RUNNER_TEMP/accounting-release.tar.gz" \
            --commit "${{ github.sha }}" \
            --mode "${{ inputs.mode }}"

      - name: Configure pinned SSH transport
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_DEPLOY_KEY" > "$HOME/.ssh/production_deploy"
          chmod 0600 "$HOME/.ssh/production_deploy"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Send release to the restricted production receiver
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/accounting-release.tar.gz" | \
            ssh -T \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -i "$HOME/.ssh/production_deploy" \
              "$PROD_USER@$PROD_HOST"

      - name: Verify public health after deployment
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://driverform.ru/ >/dev/null
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://driverform.ru/driver-sw.js >/dev/null
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://driverform.ru/excavator-sw.js >/dev/null
