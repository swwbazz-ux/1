name: Django MVP checks

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    name: Django check and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: СИСТЕМА_MVP/backend

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: СИСТЕМА_MVP/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare media directories
        run: mkdir -p media/employee_photos

      - name: Django system check
        run: python manage.py check

      # Полный nightly прогоняет группу `tools`, но на ревизии канонической
      # ветки, поэтому контракты workflow-файлов самой default-ветки там не
      # проверяются. Этот шаг закрывает пробел: orchestration, watchdog и
      # уведомитель живут только в `main` и должны иметь свой gate.
      - name: Run standalone tools contract tests
        run: python -m unittest discover -s tools -p 'test*.py'

      - name: Run user module tests
        run: python manage.py test users
