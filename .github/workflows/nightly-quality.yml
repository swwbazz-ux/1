name: Full nightly quality gate

on:
  push:
    branches:
      - codex/github-production-deploy-20260916
    paths:
      - .github/workflows/**
      - .github/ci/**
      - tools/**
      - СИСТЕМА_MVP/backend/**
      - mobile/**
  pull_request:
    paths:
      - .github/workflows/django.yml
      - .github/workflows/nightly-quality.yml
      - .github/ci/**
      - СИСТЕМА_MVP/backend/tools/validate_ci_test_matrix.py
  workflow_dispatch:
    inputs:
      target_ref:
        description: Full commit SHA or branch to verify
        required: true
        default: codex/github-production-deploy-20260916
        type: string
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: full-nightly-quality
  cancel-in-progress: false

env:
  QUALITY_TARGET_REF: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref ||
    github.event_name == 'pull_request' && github.sha ||
    'codex/github-production-deploy-20260916' }}
  DJANGO_SECRET_KEY: ci-secret-key
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,.localhost

jobs:
  resolve-revision:
    name: Resolve one immutable revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}

    steps:
      - name: Checkout requested revision once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QUALITY_TARGET_REF }}

      - name: Export immutable commit SHA
        id: revision
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "${sha:0:12}" >> "$GITHUB_OUTPUT"
          printf 'Verified commit: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

  full-django-postgresql:
    name: Full Django suite on PostgreSQL
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accounting_mvp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounting_mvp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_DB: accounting_mvp_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"

    defaults:
      run:
        working-directory: СИСТЕМА_MVP/backend

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: СИСТЕМА_MVP/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare test directories
        run: mkdir -p media/employee_photos artifacts

      - name: Validate Django project and test plan
        run: |
          python manage.py check
          python manage.py makemigrations --check
          python tools/validate_ci_test_matrix.py \
            --manifest ../../.github/ci/django-test-matrix.json

      - name: Run the complete Django test suite sequentially
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --verbosity 1 2>&1 | tee artifacts/django-full-postgresql.log

      - name: Run standalone tools contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools -p 'test*.py' 2>&1 \
            | tee artifacts/django-tools-contracts.log

      - name: Upload Django logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-django-${{ needs.resolve-revision.outputs.short_sha }}-logs
          path: СИСТЕМА_MVP/backend/artifacts/*.log
          if-no-files-found: warn
          retention-days: 14

  all-javascript-contracts:
    name: All JavaScript and mobile contracts
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/capacitor-shell/package-lock.json

      - name: Run all backend JavaScript contracts
        working-directory: СИСТЕМА_MVP/backend
        shell: bash
        run: |
          mapfile -d '' test_files < <(
            find static/js/tests -type f -name '*.test.js' -print0 | sort -z
          )
          test "${#test_files[@]}" -gt 0
          node --test "${test_files[@]}"

      - name: Install mobile shell dependencies
        working-directory: mobile/capacitor-shell
        run: npm ci --ignore-scripts

      - name: Run all mobile shell contracts
        working-directory: mobile/capacitor-shell
        run: npm test

  android-debug-builds:
    name: Android debug tests and all profiles
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: mobile/capacitor-shell/android/**/*.gradle*

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/capacitor-shell/package-lock.json

      - name: Install mobile shell dependencies
        working-directory: mobile/capacitor-shell
        run: npm ci --ignore-scripts

      - name: Synchronize Capacitor Android project
        working-directory: mobile/capacitor-shell
        run: npm run cap:sync

      - name: Run Android unit tests and build every debug profile
        working-directory: mobile/capacitor-shell/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test assembleDebug

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-android-${{ needs.resolve-revision.outputs.short_sha }}-reports
          path: |
            mobile/capacitor-shell/android/app/build/reports/tests/
            mobile/capacitor-shell/android/app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 7

  nightly-quality-summary:
    name: Nightly quality summary
    if: always()
    needs:
      - resolve-revision
      - full-django-postgresql
      - all-javascript-contracts
      - android-debug-builds
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every nightly group to pass
        env:
          RESOLVE_RESULT: ${{ needs.resolve-revision.result }}
          TARGET_SHA: ${{ needs.resolve-revision.outputs.sha }}
          DJANGO_RESULT: ${{ needs.full-django-postgresql.result }}
          JAVASCRIPT_RESULT: ${{ needs.all-javascript-contracts.result }}
          ANDROID_RESULT: ${{ needs.android-debug-builds.result }}
        run: |
          printf 'sha=%s\nresolve=%s\ndjango=%s\njavascript=%s\nandroid=%s\n' \
            "$TARGET_SHA" "$RESOLVE_RESULT" "$DJANGO_RESULT" \
            "$JAVASCRIPT_RESULT" "$ANDROID_RESULT"
          test "$RESOLVE_RESULT" = success
          test "$DJANGO_RESULT" = success
          test "$JAVASCRIPT_RESULT" = success
          test "$ANDROID_RESULT" = success
