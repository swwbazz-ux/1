name: Nightly scheduler watchdog

on:
  schedule:
    # Primary full run is scheduled for 18:17 UTC in nightly-quality.yml.
    # These lightweight retries only dispatch it when GitHub dropped that run.
    - cron: "27,37 18 * * *"
    # One-time automatic acceptance probe for 2026-09-21 UTC.
    - cron: "45 19 21 9 *"

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-scheduler-watchdog
  cancel-in-progress: false

jobs:
  ensure-nightly-run:
    name: Ensure one automatic nightly run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check today's automatic runs and dispatch only when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_WORKFLOW: nightly-quality.yml
          NIGHTLY_TARGET: codex/github-production-deploy-20260916
        run: |
          set -euo pipefail

          window_start="$(date -u +%Y-%m-%d)T18:00:00Z"
          runs_json="$(gh api \
            "repos/${GH_REPO}/actions/workflows/${NIGHTLY_WORKFLOW}/runs?per_page=50")"

          existing_run="$(
            jq -r \
              --arg window_start "$window_start" \
              '.workflow_runs[]
               | select(.created_at >= $window_start)
               | select(
                   .event == "schedule"
                   or (
                     .event == "workflow_dispatch"
                     and .actor.login == "github-actions[bot]"
                   )
                 )
               | [.id, .event, .status, (.conclusion // "pending"), .html_url]
               | @tsv' \
              <<<"$runs_json" \
            | head -n 1
          )"

          if [[ -n "$existing_run" ]]; then
            printf 'Automatic nightly already exists: %s\n' "$existing_run"
            printf 'No fallback dispatch was needed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GH_REPO}/actions/workflows/${NIGHTLY_WORKFLOW}/dispatches" \
            -f ref=main \
            -f "inputs[target_ref]=${NIGHTLY_TARGET}"

          printf 'GitHub missed the primary schedule; watchdog dispatched `%s`.\n' \
            "$NIGHTLY_TARGET" >> "$GITHUB_STEP_SUMMARY"
