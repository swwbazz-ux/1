[tool.ruff]
required-version = "==0.16.8"
target-version = "py312"
line-length = 100
preview = false
fix = false
force-exclude = true
respect-gitignore = true
extend-exclude = [
    "**/migrations/**",
    "**/vendor/**",
    "**/generated/**",
    "**/qa_artifacts/**",
    "**/staticfiles/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
